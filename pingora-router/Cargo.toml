[package]
name = "pingora-router"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3.31"
pingora = { version = "0.8.0", features = ["lb", "boringssl"] }
serde = "1.0.219"
serde_json = "1.0.140"
uuid = { version = "1.25", features = ["v4"] }
tracing = "0.1.41"
reqwest = { version="0.13.4" }


# opentelemetry
opentelemetry = "0.32"
tracing-opentelemetry = "0.33.0"
opentelemetry-http = "0.32.0"