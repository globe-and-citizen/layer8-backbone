[package]
name = "utils"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.16.0", features = ["v4"] }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["derive"] }
base64 = "0.21.7"
chrono = "0.4.40"
jsonwebtoken = "9.3.1"
url = "2.5.4"
x509-parser = "0.17.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2.3"
bincode = "2.0.1"
arc-swap = "1.7.1"
boring = "4.17.0"
pingora = { version = "0.8.0", features = ["lb", "boringssl"] }
blake3 = "1.8.3"

# opentelemetry
tracing-opentelemetry = "0.33"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "http-proto"] }

