[package]
name = "reverse-proxy"
version = "0.4.2"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version="0.11", default-features=false, features=["json", "rustls-tls"] }
tokio = "1.44.2"
pingora-router = { path = "../pingora-router", version = "0.1.0" }
pingora = { version = "0.8.0", features = ["lb", "boringssl"] }
futures = "0.3.31"
boring = "4.17.0"
once_cell = "1.21.3"
dotenv = "0.15.0"
ntor = { git = "https://github.com/globe-and-citizen/ntor.git", tag = "0.1.3"}
utils = { path = "../utils", version = "0.1.0" }
envy = "0.4.2"
tracing = "0.1.41"
bincode = "2.0.1"
axum = { version = "0.8.9", features = ["json"] }
dashmap = "6.1.0"
secrecy = "0.8"

[[test]]
name = "unit_test_handler"
path = "tests/unit_test/handler.rs"

[[test]]
name = "unit_test_proxy"
path = "tests/unit_test/proxy.rs"

[[test]]
name = "unit_test_init_tunnel"
path = "tests/unit_test/init_tunnel.rs"

[[test]]
name = "integration_test_init_tunnel"
path = "tests/integration_test/init_tunnel.rs"

[[test]]
name = "integration_test_proxy"
path = "tests/integration_test/proxy.rs"

